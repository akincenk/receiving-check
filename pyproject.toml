[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receiving-check"
version = "0.1.0.dev0"
description = "Reconcile deliveries: purchase order vs advance ship notice (ASN) vs receipt scans, with SSCC checks and hold rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
receiving-check = "receiving_check.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
